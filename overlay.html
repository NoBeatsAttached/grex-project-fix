<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT FIX // OVERLAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --panel:#141819; --panel-2:#1a1f21; --line:#2b3336;
    --text:#e9e7e1; --dim:#8b948f; --amber:#ffb03a; --teal:#3fd1c4; --red:#ff5f56;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* transparent so OBS shows only the badge */
  html,body{background:transparent;font-family:'JetBrains Mono',monospace;overflow:hidden}

  /* the badge sits in a corner; OBS positions the whole source, this just pads it off the edge */
  #stage{position:fixed;top:28px;right:28px}
  #badge{
    width:300px;background:linear-gradient(180deg,#161b1c,#0f1213);
    border:1px solid var(--line);border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
    overflow:hidden;opacity:0;transform:translateY(-10px);
    transition:opacity .4s ease, transform .4s ease;
  }
  #badge.show{opacity:1;transform:translateY(0)}

  .top{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#12171800,#0000)}
  .led{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 9px var(--amber);flex:none;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;letter-spacing:.05em;color:var(--text)}
  .brand span{color:var(--dim);font-weight:500}
  .state{margin-left:auto;font-size:10px;letter-spacing:.18em;color:var(--amber);font-weight:700}

  .body{display:flex;gap:14px;padding:14px}
  .left{flex:1;min-width:0}
  .kicker{font-size:9px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
  .count{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;line-height:1;color:var(--teal)}
  .count-label{font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-top:3px}
  .timer{margin-top:13px}
  .timer .clock{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;color:var(--amber);letter-spacing:.04em}
  .timer .tlabel{font-size:9px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin-top:2px}

  .qr{flex:none;width:82px}
  .qr .frame{width:82px;height:82px;background:#fff;border-radius:8px;padding:6px;display:flex;align-items:center;justify-content:center}
  .qr canvas,.qr img{width:100%;height:100%;display:block}
  .qr .scan{font-size:8px;letter-spacing:.12em;color:var(--dim);text-align:center;text-transform:uppercase;margin-top:5px;line-height:1.3}
  .qr .scan b{color:var(--teal);font-weight:500}

  /* count bump animation when a new submission lands */
  .count.bump{animation:bump .5s ease}
  @keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.18);color:var(--amber)}100%{transform:scale(1);color:var(--teal)}}

  /* closed state: slim brand + QR card, no dead count/timer */
  #badge.closed .led{background:var(--dim);box-shadow:none;animation:none}
  #badge.closed .state{color:var(--dim)}
  #badge.closed .left .kicker,
  #badge.closed .left .count,
  #badge.closed .left .count-label,
  #badge.closed .left .timer{display:none}
  #badge.closed .left .closed-msg{display:block}
  .left .closed-msg{display:none;font-size:11px;line-height:1.6;color:var(--dim)}
  .left .closed-msg b{color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:13px;display:block;margin-bottom:6px}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://cdkzbbrakewvhmejzryj.supabase.co";
const SUPABASE_KEY = "sb_publishable_Rba1RBrB7u0_79fUzEUYhw_Wm_Ev_42";
const SITE_URL = "https://nobeatsattached.github.io/grex-project-fix/";
const POLL_MS = 8000; // how often to refresh count + window (8s is gentle on the free tier)
/* ========================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let countdownTimer = null, pollTimer = null, lastCount = 0, currentWindow = null;

// QR is now an inline SVG in the markup — no library, no external requests, nothing to block.

async function poll() {
  const now = new Date().toISOString();
  const { data, error } = await sb.from("windows").select("*")
    .lte("opens_at", now).gte("closes_at", now)
    .order("closes_at", { ascending: true }).limit(1);

  if (error) return; // keep showing last known state on a hiccup

  const win = data && data[0] ? data[0] : null;

  if (!win) {
    // no open window -> slim closed card (QR stays visible), don't hide.
    // Look ahead for the next scheduled window and show its real date.
    $("badge").classList.add("show");
    $("badge").classList.add("closed");
    $("state").textContent = "CLOSED";
    currentWindow = null;
    clearInterval(countdownTimer);

    const { data: next } = await sb.from("windows").select("opens_at,title")
      .gt("opens_at", now).order("opens_at", { ascending: true }).limit(1);
    const msg = $("closedMsgText");
    if (next && next[0]) {
      msg.innerHTML = 'Next window opens<br><b style="color:var(--amber)">' + fmtNext(next[0].opens_at) + '</b><br>Scan to get ready.';
    } else {
      msg.textContent = 'Submissions are closed right now — scan to catch the next window.';
    }
    return;
  }

  $("badge").classList.remove("closed");
  $("state").textContent = "OPEN";

  // window changed (new one, or reopened) -> restart countdown
  if (!currentWindow || currentWindow.id !== win.id || currentWindow.closes_at !== win.closes_at) {
    currentWindow = win;
    startCountdown(win);
  }
  $("badge").classList.add("show");

  // live submission count
  const { count } = await sb.from("submissions")
    .select("id", { count: "exact", head: true })
    .eq("window_id", win.id);
  if (typeof count === "number") setCount(count);
}

function setCount(n) {
  const el = $("count");
  el.textContent = n;
  if (n > lastCount) { // bump animation when a new one lands
    el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
  }
  lastCount = n;
}

function startCountdown(win) {
  clearInterval(countdownTimer);
  const tick = () => {
    const ms = new Date(win.closes_at) - new Date();
    if (ms <= 0) { $("clock").textContent = "00:00:00"; clearInterval(countdownTimer); poll(); return; }
    const totalH = Math.floor(ms / 3600000);
    const m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;
    const pad = n => String(n).padStart(2, "0");
    $("clock").textContent = pad(totalH) + ":" + pad(m) + ":" + pad(s);
  };
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function fmtNext(iso) {
  return new Date(iso).toLocaleString(undefined, { weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
}

poll();
pollTimer = setInterval(poll, POLL_MS);
</script>
