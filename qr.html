<meta charset="UTF-8">

<title>PROJECT FIX // QR</title>
<style>
  @font-face{ font-family:'CodeFont'; src:url('Code_Font.ttf') format('truetype'); font-display:swap; }
  :root{ --line:#3a4448; --text:#f2f0ea; --dim:#9aa39f; --amber:#ffb03a; --teal:#3fd1c4;
         --hud:'CodeFont','Courier New',monospace; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent;font-family:var(--hud);overflow:hidden}
  #stage{position:fixed;top:0;left:0;padding:8px}
  #card{
    display:inline-block;background:linear-gradient(180deg,#161b1c,#0e1112);
    border:2px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.4);
    opacity:0;transform:translateY(-8px);transition:opacity .35s ease, transform .35s ease;
  }
  #card.show{opacity:1;transform:translateY(0)}
  .head{
    display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:2px solid var(--line);
    background:repeating-linear-gradient(45deg,#00000000 0 6px,#ffffff08 6px 12px),linear-gradient(180deg,#1a1f20,#141819);
  }
  .led{width:12px;height:12px;background:var(--amber);box-shadow:0 0 10px var(--amber);flex:none;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .head .t{font-size:18px;letter-spacing:.12em;color:var(--text);text-transform:uppercase}
  .head .t span{color:var(--dim)}
  .qrwrap{padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .frame{width:240px;height:240px;background:#fff;padding:12px;display:flex;align-items:center;justify-content:center}
  .frame svg{width:100%;height:100%;display:block}
  .scan{font-size:20px;letter-spacing:.14em;color:var(--text);text-transform:uppercase;text-align:center}
  .scan b{color:var(--teal);font-weight:400}
  .sub{font-size:14px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;text-align:center;margin-top:-4px}
</style>
</head>
