name: Keep Supabase awake

# Supabase pauses free projects after 7 days with no activity.
# This pings the database every Monday and Thursday so that never happens.

on:
  schedule:
    - cron: "0 13 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            "https://cdkzbbrakewvhmejzryj.supabase.co/rest/v1/windows?select=id&limit=1" \
            -H "apikey: sb_publishable_Rba1RBrB7u0_79fUzEUYhw_Wm_Ev_42" \
            -H "Authorization: Bearer sb_publishable_Rba1RBrB7u0_79fUzEUYhw_Wm_Ev_42"
